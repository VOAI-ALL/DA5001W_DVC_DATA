stages:
  - test
  - build

variables:
  PYTHONPATH: "$CI_PROJECT_DIR/src"

unit_tests:
  stage: test
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - pytest

build_api_image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -f Dockerfile.api -t credit-card-fraud-api .

